name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # the tests use a fake model, so neither laya nor torch is needed
      - run: pip install "fastapi>=0.115" "httpx>=0.27" "uvicorn>=0.30"
      - run: python -m unittest discover -s tests -t . -v
